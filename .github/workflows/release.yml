name: Release Mini Astra

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Ubuntu ${{ matrix.ubuntu }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ['22.04', '24.04']
    container: ubuntu:${{ matrix.ubuntu }}
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential ca-certificates git pkg-config libdvbcsa-dev
      - uses: actions/checkout@v4
      - name: Static validation
        run: bash tests/test-static.sh
      - name: Build
        run: |
          ./configure.sh --bin=/usr/local/bin/astra-mini
          make -j"$(nproc)"
      - name: Package
        run: |
          set -eux
          version="${GITHUB_REF_NAME#v}"
          dir="mini-astra-${version}-ubuntu-${{ matrix.ubuntu }}-x86_64"
          mkdir -p "$dir/bin" "$dir/etc/mini-astra" "$dir/systemd"
          install -m 0755 astra "$dir/bin/astra-mini"
          install -m 0755 mini-astra "$dir/bin/mini-astra"
          install -m 0755 install.sh "$dir/install.sh"
          install -m 0755 uninstall.sh "$dir/uninstall.sh"
          install -m 0644 scripts/mini-astra.lua "$dir/etc/mini-astra/mini-astra.lua"
          install -m 0644 systemd/mini-astra.service "$dir/systemd/mini-astra.service"
          tar -czf "$dir.tar.gz" "$dir"
          sha256sum "$dir.tar.gz" > "$dir.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: mini-astra-ubuntu-${{ matrix.ubuntu }}
          path: |
            mini-astra-*.tar.gz
            mini-astra-*.sha256

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
